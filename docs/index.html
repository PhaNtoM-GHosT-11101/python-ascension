<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Mastery</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:#f8f7ff;color:#1f2340;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e6e4ff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:900}
.logo span{color:#7c3aed}
.xp-wrap{flex:1;min-width:120px}
.xp-bar{height:10px;background:#ede9fe;border-radius:999px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4);width:22%;border-radius:999px;transition:width .4s}
.xp-label{font-size:12px;font-weight:700;margin-top:3px}
.pill{padding:6px 12px;border-radius:999px;background:#ede9fe;border:1px solid #e6e4ff;font-size:12px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.btn{padding:10px 16px;border-radius:12px;border:none;font-weight:800;cursor:pointer;font-size:14px;font-family:inherit}
.btn-primary{background:#7c3aed;color:#fff}
.btn-green{background:#10b981;color:#fff}
.btn-ghost{background:#f3f3f3;color:#333}
.hero{text-align:center;padding:28px 16px 16px}
.hero h1{font-size:30px;font-weight:900;line-height:1.2}
.hero h1 span{color:#7c3aed}
.hero p{color:#6b7280;max-width:460px;margin:8px auto 14px;font-size:14px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 24px;max-width:900px;margin:0 auto}
.lv{background:#fff;border:2px solid #e6e4ff;border-radius:16px;padding:16px;cursor:pointer;transition:all .15s;text-align:center}
.lv:hover{border-color:#7c3aed;transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,0.12)}
.lv.done{border-color:#10b981;background:#f0fdf4}
.lv.locked{opacity:.4;cursor:not-allowed;background:#f7f7fb}
.lv-emoji{font-size:28px}
.lv-name{font-weight:800;font-size:13px;margin-top:4px}
.lv-xp{font-size:11px;color:#7c3aed;font-weight:700;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.open{display:flex}
.sheet{width:100%;max-width:860px;max-height:92vh;background:#fff;border-radius:18px;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,0.12)}
.sheet-head{padding:14px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:1}
.sheet-body{padding:16px}
.lesson{background:#f8f7ff;border:1px solid #e6e4ff;border-radius:12px;padding:14px;font-size:14px;line-height:1.6}
.lesson pre{background:#1f2340;color:#e5e7eb;padding:12px;border-radius:8px;overflow:auto;margin:8px 0}
.prob{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:14px;margin:12px 0}
.prob-title{font-weight:800;color:#c2410c}
.tests{display:grid;gap:6px;margin-top:10px}
.test{padding:8px 10px;border-radius:8px;background:#f3f3f3;font-size:12px}
.test.ok{border:1px solid #10b981;background:#ecfdf5}
.test.fail{border:1px solid #ef4444;background:#fef2f2}
.editor-wrap{border:1px solid #e6e4ff;border-radius:12px;overflow:hidden;margin-top:12px}
.editor-bar{padding:8px 12px;background:#f8f7ff;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #eee}
#editor{height:240px}
.output{background:#1f2340;color:#10b981;padding:10px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:56px;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;display:none}
.confetti.show{display:block}
.tutorial{background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;border-radius:16px;padding:20px;margin:16px;text-align:center}
.tutorial b{font-size:18px}
.tutorial p{opacity:.9;margin-top:6px;font-size:14px}
@media(max-width:600px){.hero h1{font-size:24px}#editor{height:200px}.level-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Python <span>Mastery</span></div>
  <div class="xp-wrap">
    <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
    <div class="xp-label" id="xpLabel">0 / 100 XP • Lv 1</div>
  </div>
  <div style="display:flex;gap:6px">
    <span class="pill" id="streak">🔥 1</span>
    <span class="pill" id="solved">0 done</span>
  </div>
</div>

<div class="tutorial">
  <b>Welcome to Python Mastery</b>
  <p>Read the lesson → write code → press Submit. <b>10 levels to start</b>, 490 more unlock as you play.</p>
</div>

<div class="level-grid" id="grid"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-head">
      <div><b id="mTitle" style="font-size:16px">Level 1</b></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="mXp" class="pill" style="background:#ede9fe;color:#7c3aed">+20 XP</span>
        <button class="btn btn-ghost" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div id="mLesson" class="lesson"></div>
      <div class="prob">
        <div class="prob-title" id="mProbTitle">Your task</div>
        <div id="mProbDesc" style="margin-top:6px"></div>
      </div>
      <div class="tests" id="mTests"></div>
      <div class="editor-wrap">
        <div class="editor-bar">
          <span style="font-weight:700;font-size:12px">code.py</span>
          <span style="display:flex;gap:6px">
            <button class="btn btn-ghost" onclick="resetCode()">Reset</button>
            <button class="btn btn-ghost" onclick="runCode()">▶ Run</button>
            <button class="btn btn-primary" onclick="submitCode()">Submit</button>
          </span>
        </div>
        <div id="editor"></div>
        <div id="output" class="output">Press Run or Submit</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="showHint()">💡 Hint</button>
        <button class="btn btn-ghost" onclick="showSolution()">See answer</button>
        <span style="font-size:12px;color:#6b7280;align-self:center" id="hintText">Stuck? Try a hint — no penalty first time.</span>
      </div>
    </div>
  </div>
</div>

<canvas id="confetti" class="confetti"></canvas>
<audio id="lofi" loop preload="none" src="https://cdn.pixabay.com/download/audio/2022/10/30/audio_fbd14dd6bc.mp3?filename=lofi-study-112191.mp3"></audio>

<script>
const levels = [
  {id:'l1',name:'Variables',emoji:'🟢',xp:20,lesson:`<b>Variables store values.</b><pre>x = 10\nname = "Ava"\nprint(x)</pre>`,prob:{title:'Create a variable',desc:'Make <b>a = 10</b> and print it.',starter:'# your code\n',hint:'a = 10 then print(a)',solution:'a=10\nprint(a)',tests:[{exp:'10\n',vis:true}]}},
  {id:'l2',name:'Fix it',emoji:'🟡',xp:25,lesson:`<b>Types:</b> "5" is text, 5 is number.<pre>int("5") + 5 → 10</pre>`,prob:{title:'Fix the bug',desc:'Code crashes. Fix to print <b>10</b>.',starter:'x = "5"\ny = 5\nprint(x + y)\n',hint:'Use int(x) + y',solution:'x="5"\ny=5\nprint(int(x)+y)',tests:[{exp:'10\n',vis:true}]}},
  {id:'l3',name:'Say hi',emoji:'🔵',xp:20,lesson:`<b>f-strings:</b> `Hi {name}``<pre>name = "Sam"\nprint(f"Hi {name}")</pre>`,prob:{title:'Say hello',desc:'Print <code>Hi Shadow</code>',starter:'name = ""\n',hint:'name = "Shadow"',solution:'name="Shadow"\nprint(f"Hi {name}")',tests:[{exp:'Hi Shadow\n',vis:true}]}},
  {id:'l4',name:'Double it',emoji:'🟣',xp:30,lesson:`<b>input()</b> reads text. <code>int()</code> makes it a number.<pre>n = int(input())\nprint(n*2)</pre>`,prob:{title:'Double the number',desc:'Read n, print n*2. We test with <b>7 → 14</b>.',starter:'# your code\n',hint:'n = int(input()) then print(n*2)',solution:'n=int(input())\nprint(n*2)',tests:[{inp:'7\n',exp:'14\n',vis:true},{inp:'3\n',exp:'6\n',vis:false}]}},
  {id:'l5',name:'Boss',emoji:'🔴',xp:50,lesson:`<b>type()</b> tells the type.<pre>len("hi") → 2\ntype("hi").__name__ → "str"</pre>`,prob:{title:'Boss: length + type',desc:'Input text, print <code>length type</code> (e.g. "hello" → "5 str").',starter:'s = input()\n',hint:'print(f"{len(s)} {type(s).__name__}")',solution:'s=input()\nprint(f"{len(s)} {type(s).__name__}")',tests:[{inp:'hello\n',exp:'5 str\n',vis:true},{inp:'hi\n',exp:'2 str\n',vis:false}]}},
  {id:'l6',name:'Even/Odd',emoji:'🟠',xp:30,lesson:`<b>if</b> makes choices.<pre>if n%2==0:\n  print("even")\nelse:\n  print("odd")</pre>`,prob:{title:'Even or odd?',desc:'Read n, print even or odd.',starter:'n=int(input())\n',hint:'if n%2==0: print("even") else: print("odd")',solution:'n=int(input())\nprint("even" if n%2==0 else "odd")',tests:[{inp:'4\n',exp:'even\n',vis:true},{inp:'3\n',exp:'odd\n',vis:false}]}},
  {id:'l7',name:'Counting',emoji:'🟢',xp:30,lesson:`<b>for</b> repeats.<pre>for i in range(3):\n  print(i)</pre>`,prob:{title:'Print 1 to n',desc:'Read n, print 1..n on separate lines. n=3 → 1 2 3.',starter:'n=int(input())\n',hint:'for i in range(1,n+1): print(i)',solution:'n=int(input())\nfor i in range(1,n+1): print(i)',tests:[{inp:'3\n',exp:'1\n2\n3\n',vis:true}]}},
  {id:'l8',name:'Functions',emoji:'🟡',xp:30,locked:false,lesson:`<b>def</b> creates reusable code.<pre>def greet(n):\n  print(f"Hi {n}")\ngreet("Sam")</pre>`,prob:{title:'Greet function',desc:'Write <b>greet(name)</b> that prints <code>Hi {name}</code>.',starter:'def greet(name):\n  # your code\n',hint:'print(f"Hi {name}") inside function',solution:'def greet(name):\n  print(f"Hi {name}")\ngreet("Python")',tests:[{exp:'Hi Python\n',vis:true}]}},
  {id:'l9',name:'Lists',emoji:'🔵',xp:30,locked:true,lesson:`<b>Lists</b> store multiple items.<pre>li = [1,2,3]\nprint(li[0])  # 1</pre>`,prob:{title:'First element',desc:'Given list, print first item.',starter:'li = [10,20,30]\n',hint:'print(li[0])',solution:'li=[10,20,30]\nprint(li[0])',tests:[{exp:'10\n',vis:true}]}},
  {id:'l10',name:'Dicts',emoji:'🟣',xp:35,locked:true,lesson:`<b>Dictionaries</b> store key:value pairs.<pre>d = {"a":1}\nprint(d["a"])  # 1</pre>`,prob:{title:'Dict lookup',desc:'Given d = {"x":42}, print the value of "x".',starter:'d = {"x":42}\n',hint:'print(d["x"])',solution:'d={"x":42}\nprint(d["x"])',tests:[{exp:'42\n',vis:true}]}},
];

let state = JSON.parse(localStorage.getItem('pm_state')||'null')||{xp:0,lvl:1,done:[],streak:1,last:new Date().toDateString()};
function save(){localStorage.setItem('pm_state',JSON.stringify(state));render()}
function render(){
  document.getElementById('xpFill').style.width=Math.min(100,(state.xp%(state.lvl*100)))+'%';
  document.getElementById('xpLabel').textContent=`${state.xp} XP • Lv ${state.lvl}`;
  document.getElementById('streak').textContent=`🔥 ${state.streak}`;
  document.getElementById('solved').textContent=`${state.done.length} done`;
  const g=document.getElementById('grid');g.innerHTML='';
  levels.forEach((lv,i)=>{
    const done=state.done.includes(lv.id);
    const open=!done&&(i===0||state.done.includes(levels[i-1].id));
    const locked=lv.locked||(!done&&!open);
    const cls=done?'done':locked?'locked':'';
    g.innerHTML+=`<div class="lv ${cls}" onclick="openLevel('${lv.id}')">
      <div class="lv-emoji">${done?'✓':lv.emoji}</div>
      <div class="lv-name">${lv.name}</div>
      <div class="lv-xp">+${lv.xp} XP</div>
    </div>`;
  });
  g.innerHTML+=`<div style="display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;font-weight:700">+490 levels unlock as you go</div>`;
}
let cur=null,pyodide=null,editor=null;
async function initPy(){try{pyodide=await loadPyodide();document.getElementById('output').textContent='Ready — write code and press Submit';}catch(e){document.getElementById('output').textContent='Python load error: '+e}}
initPy();
require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'}});
require(['vs/editor/editor.main'],()=>{editor=monaco.editor.create(document.getElementById('editor'),{value:'# start\n',language:'python',theme:'vs',fontSize:14,minimap:{enabled:false},automaticLayout:true,wordWrap:'on'})});
function openLevel(id){
  const lv=levels.find(x=>x.id===id);if(!lv)return;
  if(lv.locked)return;
  if(state.done.includes(id)){toast('Already done — try for speed');return}
  const i=levels.findIndex(x=>x.id===id);
  if(!state.done.includes(id)&&i>0&&!state.done.includes(levels[i-1].id)){toast('Do previous level first');return}
  cur=lv;
  document.getElementById('mTitle').textContent=lv.emoji+' '+lv.name;
  document.getElementById('mXp').textContent='+'+lv.xp+' XP';
  document.getElementById('mLesson').innerHTML=lv.lesson;
  document.getElementById('mProbTitle').textContent=lv.prob.title;
  document.getElementById('mProbDesc').innerHTML=lv.prob.desc;
  document.getElementById('mTests').innerHTML=lv.prob.tests.map((t,j)=>`<div class="test">${t.vis?`Example ${j+1}: expect <code>${esc(t.exp)}</code>`:`🔒 Hidden test ${j+1}`}</div>`).join('');
  if(editor)editor.setValue(lv.prob.starter);
  document.getElementById('output').textContent='Press Run to test, Submit to finish';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'↵')}
function resetCode(){if(editor)editor.setValue(cur.prob.starter)}
async function runCode(){
  if(!pyodide)return toast('Python still loading...');
  const code=editor.getValue();
  try{const sc=code.replace(/\\/g,'\\\\').replace(/"""/g,'\\"\\"\\"');
  const r=await pyodide.runPythonAsync(`
import sys,io,traceback
sys.stdout=io.StringIO();sys.stderr=io.StringIO()
code="""${sc}"""
try:exec(code,{});print(sys.stdout.getvalue()+sys.stderr.getvalue() or "No print — did you forget print?")
except Exception:traceback.format_exc()`);
  document.getElementById('output').textContent=r;}catch(e){document.getElementById('output').textContent='Error: '+e}
}
async function submitCode(){
  if(!cur||!pyodide)return;
  const code=editor.getValue();document.getElementById('output').textContent='Checking...';
  let ok=true,logs=[];
  for(const t of cur.prob.tests){
    const sc=code.replace(/\\/g,'\\\\').replace(/"""/g,'\\"\\"\\"');
    const inp=(t.inp||'').replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n');
    try{const r=await pyodide.runPythonAsync(`
import sys,io,traceback,builtins
_it="""${inp}""".splitlines(True).__iter__()
def mi(p=""):try{return next(_it).rstrip("\\n")}except:return"""
builtins.input=mi;sys.stdout=io.StringIO()
code="""${sc}"""
try:exec(code,{});sys.stdout.getvalue()
except Exception:traceback.format_exc()`);
    const pass=r===t.exp;logs.push((pass?'✅':'❌')+' '+(t.vis?'Example':'Hidden')+': '+(pass?'pass':JSON.stringify(r)+' vs '+JSON.stringify(t.exp)));if(!pass)ok=false;
  }catch(e){logs.push('❌ '+e);ok=false}
  document.getElementById('output').textContent=logs.join('\n');
  if(ok){
    if(!state.done.includes(cur.id)){state.done.push(cur.id);state.xp+=cur.xp;if(state.xp>=state.lvl*100){state.lvl++;toast('Level up! 🎉 Lv '+state.lvl)}const today=new Date().toDateString();if(state.last!==today)state.streak++;save();}
    else toast('Already done');
    confetti();setTimeout(()=>{closeModal();render()},900);
  }else{toast('Not yet — check output')}
}
function showHint(){document.getElementById('output').textContent='💡 '+cur.prob.hint}
function showSolution(){document.getElementById('output').textContent='Answer:\n'+cur.prob.solution}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2340;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-weight:700';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function toggleMusic(){const a=document.getElementById('lofi');const b=document.getElementById('mBtn');if(a.paused){a.volume=.2;a.play().catch(()=>{});document.getElementById('mBtn').textContent='🎵 On'}else{a.pause();document.getElementById('mBtn').textContent='🎵 Off'}}
document.getElementById('mBtn').textContent='🎵 Off';
function confetti(){const c=document.getElementById('confetti');c.classList.add('show');const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const ps=[...Array(60)].map(()=>({x:Math.random()*c.width,y:-20,vx:(Math.random()-.5)*6,vy:Math.random()*6+4,r:Math.random()*6+3,c:`hsl(${260+Math.random()*60},90%,60%)`}));let id=setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});if(ps[0].y>c.height+20){clearInterval(id);c.classList.remove('show');ctx.clearRect(0,0,c.width,c.height)}},16)}
render();
</script>
</body>
</html>
